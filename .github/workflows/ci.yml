name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Build și toate testele, inclusiv Testcontainers (Docker e pe runner). Fără testele „ui”.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Ledger lint
        run: python3 docs/agents/tools/ledger-lint.py
