name: CI

on:
  push:
  pull_request:

# Tokenul GitHub doar citește: build-ul rulează plugin-uri Maven și imagini Testcontainers.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Distribuția Maven descărcată de ./mvnw (un run a picat la descărcarea ei, 2026-11-19).
      - uses: actions/cache@v6.0.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # Build și toate testele, inclusiv Testcontainers (Docker e pe runner). Fără testele „ui”.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Ledger lint
        run: python3 docs/agents/tools/ledger-lint.py
