# Render Blueprint (D-037): aplicația din Dockerfile, plan gratuit, Frankfurt.
# Valorile conexiunii la Neon se completează în Render la crearea Blueprint-ului; nu intră în git.
# SPRING_DATASOURCE_URL: conexiunea directă (nu „pooler”), cu certificatul verificat (D-040):
#   jdbc:postgresql://<host-neon>/<baza>?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
services:
  - type: web
    name: autobuze
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # Deploy doar la cerere, după acordul autorului (AGENTS.md → Release).
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
