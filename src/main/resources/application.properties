spring.application.name=autobuze

# Render dă portul în PORT; local, 8080.
server.port=${PORT:8080}

# Conexiunea vine din SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (Docker Compose, Render).
# Neon: conexiunea directă (nu „pooler”). Pool mic: Neon gratuit și RAM puțin pe Render (D-037).
spring.datasource.hikari.maximum-pool-size=3
# Fără conexiuni ținute deschise: Neon adoarme după 5 min fără activitate (D-037).
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

spring.flyway.enabled=true

# Importul GTFS (D-019, D-038). Adresa oficială redirecționează spre arhiva versiunii curente.
autobuze.import.feed-url=https://tursib.ro/trasee/gtfs
# Tokenul endpoint-ului /admin/import (C-001). Gol: endpoint-ul răspunde 404.
autobuze.import.token=${IMPORT_TOKEN:}

# Primul admin (D-055): la fiecare pornire, contul cu ADMIN_EMAIL primește rolul ADMIN și parola din
# ADMIN_PASSWORD. Goale: niciun admin.
autobuze.admin.email=${ADMIN_EMAIL:}
autobuze.admin.password=${ADMIN_PASSWORD:}

# Render pune aplicația în spatele unui proxy HTTPS: cu X-Forwarded-*, cookie-ul de sesiune e Secure și
# redirecturile rămân pe https.
server.forward-headers-strategy=framework
