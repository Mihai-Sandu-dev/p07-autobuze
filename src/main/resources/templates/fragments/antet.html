<!doctype html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- DS-autobuze-antet: logo-ul (pătratul cu autobuzul, docs/design/brand/), numele aplicației ca text,
     în culoarea temei, și butonul de temă (D-039). Linkurile de navigare
     apar odată cu paginile lor (planul „scheletul proiectului”): „Hartă” duce la /harta (D-030).
     Vizitator: „Autentificare” cu întoarcere pe pagina curentă (D-032); logat: Acasă · Hartă · Ieșire (ieșirea e POST, D-058).
     Parametrul `pagina` marchează linkul paginii curente. -->
<header class="antet" th:fragment="antet(pagina)">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r="0.5"/><circle cx="16" cy="14.5" r="0.5"/></symbol>
    <symbol id="i-luna" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-soare" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  </svg>
  <a class="brand" th:href="@{/}" href="/"><img class="logo" src="/img/logo-64.png" th:src="@{/img/logo-64.png}" width="32" height="32" alt="">Staționar</a>
  <nav aria-label="Navigare principală">
    <a th:if="${utilizator != null}" href="/" th:href="@{/}" th:aria-current="${pagina == 'acasa'} ? 'page'">Acasă</a>
    <a href="/harta" th:href="@{/harta}" th:aria-current="${pagina == 'harta'} ? 'page'">Hartă</a>
    <a th:if="${utilizator == null}" href="/autentificare" th:href="@{/autentificare(inapoi=${caleCurenta})}"
       th:aria-current="${pagina == 'autentificare'} ? 'page'">Autentificare</a>
    <form th:if="${utilizator != null}" class="iesire" action="/iesire" th:action="@{/iesire}" method="post"><button
        type="submit">Ieșire</button></form>
  </nav>
  <button class="tema" type="button" aria-pressed="false" aria-label="Temă întunecată" title="Temă întunecată">
    <svg class="ic luna" aria-hidden="true"><use href="#i-luna"/></svg>
    <svg class="ic soare" aria-hidden="true"><use href="#i-soare"/></svg>
  </button>
</header>
</body>
</html>
